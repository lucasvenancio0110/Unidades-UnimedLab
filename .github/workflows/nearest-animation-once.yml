name: Apply guided nearest-unit animation

on:
  push:
    paths:
      - '.github/workflows/nearest-animation-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply patch
        run: node scripts/patch-nearest-animation.cjs
      - name: Validate JavaScript syntax
        run: node --check assets/app-fast.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-fast.js assets/recommendation.css index.html
          git commit -m "feat: guide search to nearest unit" || exit 0
          git push
